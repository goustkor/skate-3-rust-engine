[workspace]
members = ["crates/skate-core", "crates/skate-data", "crates/skate-game", "crates/skate-dynamics", "crates/skate-mods", "crates/skate-net", "crates/skate-proto", "crates/skate-steam-relay", "vendor/bevy_render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "=0.18.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.dev]
opt-level = 3
# Full debug info makes Bevy's dynamic_linking PDBs exceed 1 GB and trip the
# MSVC linker (LNK1140: program database limit exceeded). Line tables keep
# backtraces file/line-accurate at a fraction of the size.
debug = 1
# MSVC incremental builds have produced unresolved `anon.*.llvm.*` symbols
# (LNK2019) on relink. Disable incremental for dev to keep links deterministic.
incremental = false

[profile.release]
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
bevy_render = { path = "vendor/bevy_render" }
